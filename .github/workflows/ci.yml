name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-workspace-builder:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/research-workspace-builder/assets/workspace-template/requirements.txt
      - name: Install Research Workspace Builder dependencies
        run: python -m pip install -r skills/research-workspace-builder/assets/workspace-template/requirements.txt
      - name: Run Research Workspace Builder release checks
        run: python skills/research-workspace-builder/scripts/release_check.py
